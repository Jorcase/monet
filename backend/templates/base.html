{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}MONET{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'css/main.css' %}">
    {% block extra_css %}{% endblock %}
</head>
<body>
    <header class="navbar">
        <a class="brand" href="{% url 'home' %}">MONET</a>
        <nav class="nav-links">
            <a href="{% url 'home' %}">Agente</a>
            <a href="{% url 'detector_status' %}">Detector de hosts</a>
            <a href="{% url 'scanner_dashboard' %}">Escáner de puertos</a>
            <div class="nav-group">
                <button type="button" class="nav-toggle" aria-expanded="false">Información</button>
                <div class="nav-dropdown">
                    <a href="{% url 'agente_historial' %}">Historial del agente</a>
                    <a href="{% url 'detector_informacion' %}">Detección de red</a>
                    <a href="{% url 'escaner_informacion' %}">Escáner de puertos</a>
                </div>
            </div>
        </nav>
    </header>
    <main class="page-content">
        {% block content %}{% endblock %}
    </main>
    <footer class="page-footer">
        <small>Seminario 2025 · Backend local</small>
    </footer>
    <script>
    document.addEventListener("DOMContentLoaded", function () {
        const groups = Array.from(document.querySelectorAll(".nav-group"));
        groups.forEach((group) => {
            const button = group.querySelector("button");
            if (!button) {
                return;
            }
            button.addEventListener("click", function (event) {
                event.preventDefault();
                const isOpen = group.classList.contains("open");
                groups.forEach((g) => {
                    g.classList.remove("open");
                    const btn = g.querySelector("button");
                    if (btn) {
                        btn.setAttribute("aria-expanded", "false");
                    }
                });
                const nextState = !isOpen;
                if (nextState) {
                    group.classList.add("open");
                }
                button.setAttribute("aria-expanded", String(nextState));
            });
        });

        document.addEventListener("click", function (event) {
            if (!event.target.closest(".nav-group")) {
                groups.forEach((g) => {
                    g.classList.remove("open");
                    const btn = g.querySelector("button");
                    if (btn) {
                        btn.setAttribute("aria-expanded", "false");
                    }
                });
            }
        });

        document.addEventListener("keydown", function (event) {
            if (event.key === "Escape") {
                groups.forEach((g) => {
                    g.classList.remove("open");
                    const btn = g.querySelector("button");
                    if (btn) {
                        btn.setAttribute("aria-expanded", "false");
                    }
                });
            }
        });
    });
    </script>
    {% block extra_js %}{% endblock %}
</body>
</html>
