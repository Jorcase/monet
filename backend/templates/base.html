{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}MONET{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'css/main.css' %}">
    {% block extra_css %}{% endblock %}
</head>
<body>
    <header class="navbar">
        <a class="brand" href="{% url 'home' %}">MONET</a>
        <nav class="nav-links">
            <a href="{% url 'home' %}">Agente local</a>
            <a href="{% url 'detector_status' %}">Detección de hosts</a>
            <a href="{% url 'detector_dispositivos' %}">Dispositivos</a>
            <a href="{% url 'detector_hosts' %}">Hosts detectados</a>
            <a href="{% url 'detector_analisis' %}">Análisis</a>
        </nav>
    </header>
    <main class="page-content">
        {% block content %}{% endblock %}
    </main>
    <footer class="page-footer">
        <small>Seminario 2025 · Backend local</small>
    </footer>
    {% block extra_js %}{% endblock %}
</body>
</html>
